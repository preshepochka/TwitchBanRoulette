# TwitchBanRoulette configuration.
# Copy this file to config.toml and fill it in.
# For local testing without Twitch, delete the whole [twitch] section
# and run scripts/demo.py instead of main.py.

[twitch]
# Your Twitch channel name, as in the URL twitch.tv/<channel>.
channel = "your_channel_name"
# Client ID of your registered application (see README, "Getting a Twitch Token").
client_id = "your_client_id"
# OAuth user token (see README). The "oauth:" prefix is optional.
token = "oauth:your_token_here"
# UUID of the channel points reward that triggers the roulette.
# Twitch doesn't show it in the UI; list your rewards with:
#   python3 scripts/list_rewards.py
reward_id = "your_reward_id"

[window]
# Window size in pixels (capture this window in OBS).
width = 800
height = 200
# OBS chroma key color (RGB). Must not appear in card art or overlay.
chroma_key = [0, 255, 0]
# Optional PNG drawn on top of everything (frame, pointer, logo).
# Alpha transparency; must be sized width x height.
overlay = "assets/overlay.png"
# Animation and appearance; defaults are shown commented out.
#fps = 60
#spin_duration = 4.0          # seconds of the spin animation
#result_hold = 3.0            # seconds the winner card stays highlighted
#title = "Twitch Ban Roulette"
#highlight = { enabled = true, color = [255, 255, 255], thickness = 3, radius = 8 }
#background = { type = "chroma" }    # or { type = "color", color = [20, 20, 30] }
                                     # or { type = "image", image = "assets/bg.png" }

[roulette]
# How many random cards scroll past before the winner lands.
#lead_cards = [20, 30]

# Optional sounds. Formats: WAV or OGG (avoid MP3).
# With sounds disabled (or the section removed) the app stays fully silent.
[sounds]
#enabled = true
#volume = 1.0                        # master volume 0..1
#spin = "assets/sounds/spin.wav"     # loops during the spin
#tick = "assets/sounds/tick.wav"     # click when a card passes the pointer
#result = "assets/sounds/result.wav" # played when an outcome has no own sound

# Optional logging setup.
[logging]
#level = "info"            # debug | info | warning | error
#file = "roulette.log"     # optional: also append the log to this file
                           # (path relative to the config file)

# Each outcome is a card + weight + action.
# Weights are relative, they don't have to sum to 100:
# 40/5/55 gives the same odds as 4/0.5/5.5 or 80/10/110.
# In "message" text, {user} is replaced with the viewer's name.

[outcomes.Timeout]
image = "assets/cards/timeout.png"
weight = 40
#sound = "assets/sounds/timeout.wav"  # optional: replaces sounds.result for this card
#sound_volume = 1.0                   # 0..1
action = { type = "timeout", duration = 60 }  # duration: seconds

[outcomes.Ban]
image = "assets/cards/ban.png"
weight = 5
action = { type = "ban" }

[outcomes.Nothing]
image = "assets/cards/message.png"
weight = 45
action = { type = "message", text = "{user}, wow, absolutely nothing" }

[outcomes.Reroll]
image = "assets/cards/reroll.png"
weight = 5
action = { type = "reroll" }

[outcomes.Poll]
image = "assets/cards/poll.png"
weight = 3
action = { type = "poll", title = "What next?", choices = ["Chill", "Chaos"], duration = 60 }

[outcomes.Vip]
image = "assets/cards/vip.png"
weight = 2
action = { type = "vip_add" }

[outcomes.Airhorn]
image = "assets/cards/airhorn.png"
weight = 5
action = { type = "sound", sound = "assets/sounds/airhorn.wav", volume = 1.0 }
